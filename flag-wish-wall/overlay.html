<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>展示墙</title>
<style>
:root{--ink:#fff8e8;--font-size:36px;--stroke-color:#261b2c;--stroke-width:1px}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:"Microsoft YaHei","Noto Sans SC",sans-serif}.viewport{position:absolute;inset:0;overflow:hidden}.wall{position:absolute;color:var(--ink);font-size:var(--font-size);font-weight:900;line-height:1.5;letter-spacing:.08em;-webkit-text-stroke:var(--stroke-width) var(--stroke-color);paint-order:stroke fill;animation-timing-function:linear;animation-iteration-count:infinite}.wall.scroll-vertical{left:50%;top:100%;animation-name:scroll-up}.wall.scroll-horizontal{left:100%;top:50%;animation-name:scroll-left}.wall.vertical{writing-mode:vertical-rl;text-orientation:upright;width:auto;max-width:none;white-space:pre}.wall.vertical.scroll-horizontal{height:calc(100vh - 80px);white-space:pre-wrap}.wall.vertical .latin-slot{display:inline-block;position:relative;inline-size:calc(var(--latin-length)*.72em + .5em);block-size:1.55em;vertical-align:middle}.wall.vertical .latin-run{position:absolute;left:50%;top:50%;writing-mode:horizontal-tb;text-orientation:mixed;white-space:nowrap;font-style:italic;letter-spacing:.02em;transform:translate(-50%,-50%) rotate(65deg) skewX(-8deg);transform-origin:center}.wall.horizontal{writing-mode:horizontal-tb;text-orientation:mixed}.wall.horizontal.scroll-vertical{white-space:pre-wrap;width:calc(100vw - 80px);max-width:1600px;text-align:center}.wall.horizontal.scroll-horizontal{white-space:pre;width:max-content;max-width:none;text-align:left}.wall.horizontal .latin-slot,.wall.horizontal .latin-run{display:inline;position:static;inline-size:auto;block-size:auto;writing-mode:inherit;text-orientation:inherit;white-space:inherit;font-style:inherit;letter-spacing:inherit;transform:none}.title{color:inherit}.empty{opacity:.75}@keyframes scroll-up{from{transform:translate(-50%,0)}to{transform:translate(-50%,var(--travel))}}@keyframes scroll-left{from{transform:translate(0,-50%)}to{transform:translate(var(--travel),-50%)}}
</style>
<div class="viewport"><div class="wall" id="wall"></div></div>
<script>
let records=[],settings={wall_title:'心愿墙',entry_separator:'★',layout_mode:'vertical',scroll_axis:'vertical',scroll_speed:38,font_color:'#fff8e8',font_size:36,stroke_enabled:true,stroke_color:'#261b2c',stroke_width:1};
const wall=document.getElementById('wall');
function appendStyledText(parent,value){String(value).split(/([A-Za-z]+)/).forEach(part=>{if(!part)return;if(/^[A-Za-z]+$/.test(part)){const slot=document.createElement('span'),run=document.createElement('span');slot.className='latin-slot';slot.style.setProperty('--latin-length',String(part.length));run.className='latin-run';run.textContent=part;slot.appendChild(run);parent.appendChild(slot)}else parent.appendChild(document.createTextNode(part))})}
let hasRendered=false,renderQueued=false;
function renderNow(){hasRendered=true;const root=document.documentElement.style;root.setProperty('--ink',settings.font_color||'#fff8e8');root.setProperty('--font-size',Math.max(12,Math.min(96,Number(settings.font_size)||36))+'px');root.setProperty('--stroke-color',settings.stroke_color||'#261b2c');root.setProperty('--stroke-width',settings.stroke_enabled?Math.max(0,Math.min(6,Number(settings.stroke_width)||0))+'px':'0px');const mode=settings.layout_mode==='horizontal'?'horizontal':'vertical',axis=settings.scroll_axis==='horizontal'?'horizontal':'vertical';wall.className='wall '+mode+' scroll-'+axis;wall.replaceChildren();const title=document.createElement('span');title.className='title';appendStyledText(title,'★'+settings.wall_title+'★：');wall.appendChild(title);if(!records.length){const empty=document.createElement('span');empty.className='empty';appendStyledText(empty,'等待大家写下内容……');wall.appendChild(empty)}else{const separator=String(settings.entry_separator??'★');records.forEach((item,index)=>{const entry=document.createElement('span'),name=document.createElement('span');name.className='entry-name';appendStyledText(name,item.name||'观众');entry.appendChild(name);entry.appendChild(document.createTextNode(' '));appendStyledText(entry,item.content+(index===records.length-1?'':separator));wall.appendChild(entry)})}requestAnimationFrame(()=>{const horizontal=axis==='horizontal',travel=(horizontal?wall.scrollWidth+document.documentElement.clientWidth:wall.scrollHeight+document.documentElement.clientHeight);wall.style.setProperty('--travel','-'+travel+'px');wall.style.animationDuration=Math.max(6,travel/Math.max(10,Number(settings.scroll_speed)||38))+'s';wall.style.animationName='none';void wall.offsetHeight;wall.style.animationName=horizontal?'scroll-left':'scroll-up'})}
function render(){if(hasRendered){renderQueued=true;return}renderNow()}
wall.addEventListener('animationiteration',()=>{if(renderQueued){renderQueued=false;renderNow()}})
let socket=null,reconnectTimer=null,reconnectDelay=1000,stateSignature='';
const displaySettingKeys=['wall_title','entry_separator','layout_mode','scroll_axis','scroll_speed','font_color','font_size','stroke_enabled','stroke_color','stroke_width'];
function displaySettings(value){return Object.fromEntries(displaySettingKeys.map(key=>[key,value?.[key]]))}
function applySnapshot(snapshot,nextSettings){const nextRecords=[...(snapshot||[])].reverse(),nextDisplaySettings=displaySettings(nextSettings),signature=JSON.stringify([nextRecords,nextDisplaySettings]);if(signature===stateSignature)return;stateSignature=signature;records=nextRecords;settings={...settings,...nextDisplaySettings};render()}
async function refreshSnapshot(){try{const [recordResponse,statusResponse]=await Promise.all([fetch('/api/records?published=1',{cache:'no-store'}),fetch('/api/status',{cache:'no-store'})]);if(!recordResponse.ok||!statusResponse.ok)throw new Error('HTTP '+recordResponse.status+'/'+statusResponse.status);const recordData=await recordResponse.json(),statusData=await statusResponse.json();applySnapshot(recordData.records||[],statusData)}catch(_){}}
function scheduleReconnect(){if(reconnectTimer)return;reconnectTimer=setTimeout(()=>{reconnectTimer=null;connect()},reconnectDelay);reconnectDelay=Math.min(10000,Math.round(reconnectDelay*1.7))}
function connect(){if(socket&&(socket.readyState===WebSocket.OPEN||socket.readyState===WebSocket.CONNECTING))return;const protocol=location.protocol==='https:'?'wss':'ws';try{socket=new WebSocket(protocol+'://'+location.host+'/ws/records?view=overlay')}catch(_){scheduleReconnect();return}socket.onopen=()=>{reconnectDelay=1000;refreshSnapshot()};socket.onmessage=e=>{try{const data=JSON.parse(e.data);if(data.type==='snapshot')applySnapshot(data.records||[],data.settings||{});else{let changed=false;if(data.type==='record_added'&&data.record.published!==false){records.unshift(data.record);changed=true}if(data.type==='record_published'&&!records.some(item=>item.id===data.record.id)){records.unshift(data.record);changed=true}if(data.type==='record_deleted'&&records.some(item=>item.id===data.id)){records=records.filter(item=>item.id!==data.id);changed=true}if(data.type==='settings_updated'){const next=displaySettings(data.settings);if(JSON.stringify(displaySettings(settings))!==JSON.stringify(next)){settings={...settings,...next};changed=true}}if(changed){stateSignature=JSON.stringify([records,displaySettings(settings)]);render()}}}catch(_){refreshSnapshot()}};socket.onerror=()=>socket.close();socket.onclose=()=>{socket=null;scheduleReconnect()}}
function recover(){refreshSnapshot();connect()}
addEventListener('resize',render);addEventListener('online',recover);addEventListener('pageshow',recover);document.addEventListener('visibilitychange',()=>{if(!document.hidden)recover()});render();recover();setInterval(refreshSnapshot,30000)
</script>
</html>
