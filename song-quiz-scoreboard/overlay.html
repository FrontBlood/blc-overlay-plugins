<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>猜歌积分榜</title>
<style>
:root{--font-size:30px;--title:#ffe98a;--name:#fff8ea;--score:#ffb7d5;--panel-bg:rgba(36,27,51,.86)}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:"Microsoft YaHei","Noto Sans SC",sans-serif}.stage{width:100%;height:100%;display:flex;align-items:flex-start;justify-content:center;padding:3vh 3vw}.board{width:min(94vw,760px);padding:18px 20px 20px;background:var(--panel-bg);border:2px solid rgba(255,255,255,.22);border-radius:18px;box-shadow:0 8px 28px rgba(0,0,0,.35);font-size:var(--font-size)}.title{margin:0;text-align:center;color:var(--title);font-size:1.25em;line-height:1.25;font-weight:950;letter-spacing:.08em;text-shadow:0 2px 3px rgba(0,0,0,.65)}.session-badge{margin:.35em 0 .65em;text-align:center;color:#9ff0ba;font-size:.56em;font-weight:800;letter-spacing:.08em}.session-badge.inactive{color:#c8becf}.list{display:grid;gap:.28em}.row{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:.45em;align-items:center;min-height:1.75em;padding:.16em .5em;border-radius:.55em;background:rgba(255,255,255,.065);transition:transform .18s,background .18s}.row.changed{animation:pulse .7s ease}.rank{font-weight:950;text-align:center;color:#d9d4e0}.row:nth-child(1) .rank{color:#ffd84e}.row:nth-child(2) .rank{color:#dfe8f1}.row:nth-child(3) .rank{color:#efad72}.name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--name);font-weight:850;text-shadow:0 1px 2px rgba(0,0,0,.72)}.score{color:var(--score);font-weight:950;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.72)}.unit{font-size:.62em;margin-left:.18em}.empty{padding:1.2em;text-align:center;color:rgba(255,255,255,.75);font-size:.82em}@keyframes pulse{0%{transform:scale(1);background:rgba(255,255,255,.065)}40%{transform:scale(1.025);background:rgba(255,226,112,.3)}100%{transform:scale(1);background:rgba(255,255,255,.065)}}
</style>
<div class="stage"><section class="board"><h1 class="title" id="title"></h1><div class="session-badge inactive" id="sessionBadge"></div><div class="list" id="list"></div></section></div>
<script>
let players=[],changedUid=null,session={active:false,session_number:0},settings={board_title:'猜歌积分榜',top_n:10,font_size:30,title_color:'#ffe98a',name_color:'#fff8ea',score_color:'#ffb7d5',panel_color:'#241b33',panel_opacity:.86};const title=document.getElementById('title'),list=document.getElementById('list'),sessionBadge=document.getElementById('sessionBadge');
function rgba(hex,alpha){const clean=String(hex).replace('#',''),number=parseInt(clean,16);return'rgba('+((number>>16)&255)+','+((number>>8)&255)+','+(number&255)+','+Math.max(0,Math.min(1,Number(alpha)))+')'}
function render(){const root=document.documentElement.style;root.setProperty('--font-size',Math.max(16,Math.min(72,Number(settings.font_size)||30))+'px');root.setProperty('--title',settings.title_color);root.setProperty('--name',settings.name_color);root.setProperty('--score',settings.score_color);root.setProperty('--panel-bg',rgba(settings.panel_color,settings.panel_opacity));title.textContent=settings.board_title;sessionBadge.className='session-badge'+(session.active?'':' inactive');sessionBadge.textContent=session.active?'本场计分中':'本场计分已停止';list.replaceChildren();const visible=players.slice(0,Math.max(1,Number(settings.top_n)||10));if(!visible.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=session.active?'等待第一位猜中者……':'请在管理页开始新活动';list.appendChild(empty);return}visible.forEach(item=>{const row=document.createElement('div');row.className='row'+(item.uid===changedUid?' changed':'');const rank=document.createElement('div');rank.className='rank';rank.textContent=item.rank;const name=document.createElement('div');name.className='name';name.textContent=item.name;const score=document.createElement('div');score.className='score';score.textContent=item.score;const unit=document.createElement('span');unit.className='unit';unit.textContent='分';score.appendChild(unit);row.append(rank,name,score);list.appendChild(row)});changedUid=null}
let socket=null,reconnectTimer=null,reconnectDelay=1000,stateSignature='';
function applySnapshot(data){const nextPlayers=data.players||[],nextSession=data.session||session,nextSettings=data.settings||{},signature=JSON.stringify([nextPlayers,nextSession,nextSettings]);if(signature===stateSignature)return;stateSignature=signature;players=nextPlayers;session=nextSession;settings={...settings,...nextSettings};changedUid=null;render()}
async function refreshSnapshot(){try{const response=await fetch('/api/scores',{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);applySnapshot(await response.json())}catch(_){}}
function scheduleReconnect(){if(reconnectTimer)return;reconnectTimer=setTimeout(()=>{reconnectTimer=null;connect()},reconnectDelay);reconnectDelay=Math.min(10000,Math.round(reconnectDelay*1.7))}
function connect(){if(socket&&(socket.readyState===WebSocket.OPEN||socket.readyState===WebSocket.CONNECTING))return;const protocol=location.protocol==='https:'?'wss':'ws';try{socket=new WebSocket(protocol+'://'+location.host+'/ws/scores')}catch(_){scheduleReconnect();return}socket.onopen=()=>{reconnectDelay=1000;refreshSnapshot()};socket.onmessage=e=>{try{const data=JSON.parse(e.data);if(data.type==='snapshot')applySnapshot(data);else{if(data.type==='scoreboard'){players=data.players||[];session=data.session||session;changedUid=data.changed_uid}if(data.type==='settings')settings={...settings,...data.settings};stateSignature='';render()}}catch(_){refreshSnapshot()}};socket.onerror=()=>socket.close();socket.onclose=()=>{socket=null;scheduleReconnect()}}
function recover(){refreshSnapshot();connect()}
addEventListener('online',recover);addEventListener('pageshow',recover);document.addEventListener('visibilitychange',()=>{if(!document.hidden)recover()});render();recover();setInterval(refreshSnapshot,30000);
</script>
</html>
